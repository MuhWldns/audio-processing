  /api/verify-license:
    post:
      tags: [Verification]
      summary: Verify license key from Roblox game
      operationId: verifyLicense
      security: []
      description: |
        Public endpoint called from Roblox game servers via HttpService.
        Verifies license key validity for a specific game/place ID.
        Logs all verification attempts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [licenseKey, gameId]
              properties:
                licenseKey:
                  type: string
                  description: "License key (format: RBXR-XXXX-XXXX-XXXX-XXXX)"
                gameId:
                  type: string
                  description: Roblox place ID
                gameName:
                  type: string
                  description: Game name (optional, updates stored name)
            example:
              licenseKey: "RBXR-A2B3-C4D5-E6F7-G8H9"
              gameId: "123456789"
              gameName: "My Roblox Game"
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              examples:
                valid:
                  summary: License is valid
                  value:
                    valid: true
                    message: "License verified successfully"
                    product:
                      name: "UI System Pro"
                      version: "1.2.0"
                    license:
                      type: "PERSONAL"
                      expiresAt: null
                invalidKey:
                  summary: Invalid license key
                  value:
                    valid: false
                    message: "Invalid license key"
                suspended:
                  summary: License suspended
                  value:
                    valid: false
                    message: "License is suspended"
                expired:
                  summary: License expired
                  value:
                    valid: false
                    message: "License has expired"
                notWhitelisted:
                  summary: Game not whitelisted
                  value:
                    valid: false
                    message: "Game is not whitelisted for this license. Add it in your dashboard."
                    licenseType: "PERSONAL"
                productInactive:
                  summary: Product no longer available
                  value:
                    valid: false
                    message: "Product is no longer available"
        "400":
          description: Missing required fields
          content:
            application/json:
              example:
                valid: false
                message: "licenseKey and gameId are required"

