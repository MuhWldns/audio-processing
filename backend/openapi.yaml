      in: cookie
      name: connect.sid
      description: Session cookie set after OAuth login or dev-login
    apiKeyHeader:
      type: apiKey
      in: header
      name: x-api-key
      description: Upload API key (required for /upload endpoint)

  responses:
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Not authenticated"
    Forbidden:
      description: Admin access required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Admin access required"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
      example:
        error: "Something went wrong"

    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        walletBalance:
          type: integer
          description: Current wallet balance in Rupiah
        totalTopUp:
          type: integer
          description: Lifetime top-up total
        totalSpent:
          type: integer
          description: Lifetime spent total
        freeAudioUsedToday:
          type: integer
          description: Free audio quota used today
        freeAudioDailyLimit:
          type: integer
          description: Daily free audio limit (default 3)
        role:
          type: string
          enum: [USER, ADMIN]
        createdAt:
          type: string
          format: date-time
      example:
        id: "clx1abc123"
        email: "dev@rbxroyale.com"
        displayName: "RBX Dev"
        avatarUrl: "https://lh3.googleusercontent.com/photo.jpg"
        walletBalance: 50000
        totalTopUp: 100000
        totalSpent: 50000
        freeAudioUsedToday: 1
        freeAudioDailyLimit: 3
        role: "USER"
        createdAt: "2026-05-01T10:00:00.000Z"

    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        shortDesc:
          type: string
          nullable: true
        thumbnail:
          type: string
          nullable: true
        pricePersonal:
          type: integer
          description: Price in Rupiah for Personal license
        priceCommercial:
          type: integer
          description: Price in Rupiah for Commercial license
        priceEnterprise:
          type: integer
          description: Price in Rupiah for Enterprise license
        featured:
          type: boolean
        active:
          type: boolean
        version:
          type: string
        tags:
          type: array
          items:
            type: string
        category:
          $ref: "#/components/schemas/ProductCategory"
        images:
          type: array
          items:
            $ref: "#/components/schemas/ProductImage"
        soldCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        productCount:
          type: integer

    ProductImage:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
        sortOrder:
          type: integer

    ProductFile:
      type: object
      properties:
        id:
          type: string
        fileName:
          type: string
        fileType:
          type: string
          enum: [script, documentation, asset]
        filePath:
          type: string
        fileSize:
          type: integer
        version:
          type: string
        createdAt:
          type: string
          format: date-time

    CartItem:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        product:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
            thumbnail:
              type: string
              nullable: true
            pricePersonal:
              type: integer
            priceCommercial:
              type: integer
            priceEnterprise:
              type: integer
            active:
              type: boolean
        licenseType:
          type: string
          enum: [PERSONAL, COMMERCIAL, ENTERPRISE]
        priceRupiah:
          type: integer
        addedAt:
          type: string
          format: date-time

    License:
      type: object
      properties:
        id:
          type: string
        licenseKey:
          type: string
          description: "Format: RBXR-XXXX-XXXX-XXXX-XXXX"
        licenseType:
          type: string
          enum: [PERSONAL, COMMERCIAL, ENTERPRISE]
        status:
          type: string
          enum: [ACTIVE, SUSPENDED, REVOKED, EXPIRED]
        maxGames:
          type: integer
          nullable: true
          description: "Max whitelisted games (null = unlimited)"
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: "null = lifetime license"
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
        product:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
            thumbnail:
              type: string
              nullable: true
            version:
              type: string
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameWhitelist"
        verificationCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    GameWhitelist:
      type: object
      properties:
        id:
          type: string
        gameId:
          type: string
          description: Roblox placeId
        gameName:
          type: string
          nullable: true
        active:
          type: boolean
        addedAt:
          type: string
          format: date-time

    Purchase:
      type: object
      properties:
        id:
          type: string
        productId:
          type: string
        licenseType:
          type: string
          enum: [PERSONAL, COMMERCIAL, ENTERPRISE]
        amountRupiah:
          type: integer
        purchasedAt:
          type: string
          format: date-time

    TopUpOrder:
      type: object
      properties:
        orderId:
          type: string
        invoiceId:
          type: string
        amount:
          type: integer
          description: Amount in Rupiah
        finalAmount:
          type: integer
          nullable: true
          description: Amount actually paid (with unique code)
        paymentUrl:
          type: string
          description: Bayar.gg payment URL
        qrisImageUrl:
          type: string
          description: QR code image URL for QRIS payment
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING, COMPLETED, FAILED, CANCELED]

    UploadRecord:
      type: object
      properties:
        id:
          type: string
        fileName:
          type: string
        fileFormat:
          type: string
          enum: [wav, mp3, ogg]
        status:
          type: string
        source:
          type: string
        durationSec:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        metadata:
          type: object

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      example:
        page: 1
        limit: 20
        total: 100
        totalPages: 5

    LicenseVerificationResult:
      type: object
      properties:
        valid:
          type: boolean
        message:
          type: string
        product:
          type: object
          nullable: true
          properties:
            name:
              type: string
            version:
              type: string
        license:
          type: object
          nullable: true
          properties:
            type:
              type: string
            expiresAt:
              type: string
              format: date-time
              nullable: true

    AdminAnalytics:
      type: object
      properties:
        overview:
          type: object
          properties:
            totalProducts:
              type: integer
            totalActiveLicenses:
              type: integer
            totalPurchases:
              type: integer
            totalRevenue:
              type: integer
              description: Total revenue in Rupiah
        recentPurchases:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              user:
                type: object
                properties:
                  id:
                    type: string
                  email:
                    type: string
                  displayName:
                    type: string
              product:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
              amountRupiah:
                type: integer
              licenseType:
                type: string
              purchasedAt:
                type: string
                format: date-time
