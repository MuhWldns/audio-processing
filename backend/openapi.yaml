openapi: 3.0.3
info:
  title: RBX Royale API
  version: 1.0.0
  description: |
    Backend API for RBX Royale platform.
    Services: Audio Processing, Script Store, License Management, Wallet/Top-Up.
    Currency: Indonesian Rupiah (IDR).
    Auth: Session-based (cookie connect.sid) via Google/Discord OAuth.

servers:
  - url: http://localhost:3001
    description: Development

tags:
  - name: Health
    description: Server and database health checks
  - name: Auth
    description: Authentication (OAuth, session management)
  - name: Upload
    description: Audio file upload
  - name: History
    description: Audio upload history
  - name: TopUp
    description: Wallet top-up via Bayar.gg QRIS
  - name: Products
    description: Script store product catalog (public)
  - name: Cart
    description: Shopping cart management
  - name: Checkout
    description: Purchase and payment
  - name: Licenses
    description: License management and game whitelist
  - name: Verification
    description: License verification (called from Roblox games)
  - name: Admin
    description: Admin panel endpoints (requires ADMIN role)

paths:
  /health:
    get:
      tags: [Health]
      summary: Basic health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
              example:
                ok: true

  /db-health:
    get:
      tags: [Health]
      summary: Database connectivity check
      operationId: getDbHealth
      security: []
      responses:
        "200":
          description: Database is connected
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  database:
                    type: string
              example:
                ok: true
                database: up
        "500":
          description: Database is down
          content:
            application/json:
              example:
                ok: false
                database: down

  /auth/google:
    get:
      tags: [Auth]
      summary: Initiate Google OAuth login
      operationId: authGoogle
      security: []
      description: Redirects user to Google consent screen
      responses:
        "302":
          description: Redirect to Google OAuth
        "503":
          description: Google auth not configured
          content:
            application/json:
              example:
                error: "google auth is not configured"

  /auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth callback
      operationId: authGoogleCallback
      security: []
      description: Handles Google OAuth callback, creates session, redirects to frontend
      responses:
        "302":
          description: Redirect to frontend with login result

  /auth/discord:
    get:
      tags: [Auth]
      summary: Initiate Discord OAuth login
      operationId: authDiscord
      security: []
      description: Redirects user to Discord consent screen
      responses:
        "302":
          description: Redirect to Discord OAuth
        "503":
          description: Discord auth not configured
          content:
            application/json:
              example:
                error: "discord auth is not configured"

  /auth/discord/callback:
    get:
      tags: [Auth]
      summary: Discord OAuth callback
      operationId: authDiscordCallback
      security: []
      description: Handles Discord OAuth callback, creates session, redirects to frontend
      responses:
        "302":
          description: Redirect to frontend with login result

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      operationId: authLogout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              example:
                ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      operationId: authMe
      security: []
      description: Returns current user profile or null if not authenticated
      responses:
        "200":
          description: Current user (or null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    nullable: true
                    description: User object or null if not authenticated
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      displayName:
                        type: string
                      avatarUrl:
                        type: string
                        nullable: true
                      walletBalance:
                        type: integer
                        description: Current balance in Rupiah
                      totalTopUp:
                        type: integer
                      totalSpent:
                        type: integer
                      freeAudioUsedToday:
                        type: integer
                      freeAudioDailyLimit:
                        type: integer
                      role:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
              examples:
                authenticated:
                  summary: Logged in user
                  value:
                    user:
                      id: "clx1abc123"
                      email: "dev@rbxroyale.com"
                      displayName: "RBX Dev"
                      avatarUrl: "https://lh3.googleusercontent.com/photo.jpg"
                      walletBalance: 50000
                      totalTopUp: 100000
                      totalSpent: 50000
                      freeAudioUsedToday: 1
                      freeAudioDailyLimit: 3
                      role: "USER"
                      createdAt: "2026-05-01T10:00:00.000Z"
                notAuthenticated:
                  summary: Not logged in
                  value:
                    user: null

  /auth/dev-login:
    post:
      tags: [Auth]
      summary: Dev-only login (non-production)
      operationId: authDevLogin
      security: []
      description: |
        Creates a session without OAuth flow. Only available when NODE_ENV !== "production".
        Finds or creates user by email, auto-creates wallet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
            example:
              email: "test@example.com"
              displayName: "Test User"
      responses:
        "200":
          description: Dev login successful
          content:
            application/json:
              example:
                ok: true
                message: "Dev login successful"
                user:
                  id: "clx1abc123"
                  email: "test@example.com"
                  displayName: "Test User"
        "400":
          description: Missing email
          content:
            application/json:
              example:
                error: "email is required"
        "404":
          description: Not available in production
          content:
            application/json:
              example:
                error: "Not found"

  /upload:
    post:
      tags: [Upload]
      summary: Upload processed audio file
      operationId: uploadAudio
      security:
        - cookieAuth: []
        - apiKeyHeader: []
      description: |
        Upload an audio file. Checks daily free quota (3/day), deducts from wallet balance if quota exceeded.
        Rate limited: 30 requests per 15 minutes.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "Audio file (.wav, .mp3, .ogg)"
      responses:
        "201":
          description: Upload successful
          content:
            application/json:
              example:
                ok: true
                upload:
                  id: "clx2upload1"
                  fileName: "my-audio.wav"
                  fileFormat: "wav"
                  createdAt: "2026-05-14T10:00:00.000Z"
                  cost: 0
                  freeCovered: 1
                  paidUnits: 0
        "400":
          description: Missing or invalid file
          content:
            application/json:
              example:
                error: "Missing file"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Insufficient balance
          content:
            application/json:
              example:
                error: "Insufficient balance"
                required: 2000
                balance: 500
                freeRemaining: 0
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              example:
                error: "Too many uploads, please try again later."

  /history:
    get:
      tags: [History]
      summary: Get user upload history
      operationId: getHistory
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of upload records
          content:
            application/json:
              example:
                uploads:
                  - id: "clx2upload1"
                    fileName: "my-audio.wav"
                    fileFormat: "wav"
                    status: "completed"
                    source: "studio"
                    durationSec: null
                    createdAt: "2026-05-14T10:00:00.000Z"
                    updatedAt: "2026-05-14T10:00:00.000Z"
                    metadata: {}
                    activity:
                      id: "clx2act1"
                      title: "Audio uploaded"
                      description: "Uploaded my-audio.wav"
                      amountRupiah: 0
                      createdAt: "2026-05-14T10:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /history/{id}/download:
    get:
      tags: [History]
      summary: Download a previously uploaded file
      operationId: downloadHistory
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Upload record ID
      responses:
        "200":
          description: File download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: File not found
          content:
            application/json:
              examples:
                notFound:
                  value:
                    error: "History item not found"
                fileMissing:
                  value:
                    error: "File no longer exists"

  /topup/create:
    post:
      tags: [TopUp]
      summary: Create QRIS top-up payment
      operationId: createTopUp
      security:
        - cookieAuth: []
      description: |
        Creates a top-up order via Bayar.gg QRIS payment.
        Amount in Rupiah is credited directly to wallet balance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: integer
                  minimum: 1000
                  maximum: 500000
                  description: "Top-up amount in Rupiah (integer)"
                customer_name:
                  type: string
                customer_email:
                  type: string
                  format: email
                customer_phone:
                  type: string
            example:
              amount: 10000
              customer_name: "Test User"
              customer_email: "test@example.com"
      responses:
        "201":
          description: Top-up order created
          content:
            application/json:
              example:
                ok: true
                orderId: "clx3order1"
                invoiceId: "INV-20260514-ABC123"
                amount: 10000
                paymentUrl: "https://www.bayar.gg/pay?invoice=INV-20260514-ABC123"
                qrisImageUrl: "https://www.bayar.gg/qris-info/api/qr.php?text=...&size=300"
                expiresAt: "2026-05-14T11:00:00.000Z"
        "400":
          description: Invalid amount
          content:
            application/json:
              examples:
                notInteger:
                  value:
                    error: "Amount must be an integer"
                tooLow:
                  value:
                    error: "Amount must be at least 1000"
                tooHigh:
                  value:
                    error: "Amount exceeds QRIS limit"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Webhook URL not configured
          content:
            application/json:
              example:
                error: "Webhook URL not configured"
        "502":
          description: Payment gateway error
          content:
            application/json:
              example:
                error: "Payment gateway did not return invoice ID"

  /topup/status/{reference}:
    get:
      tags: [TopUp]
      summary: Check top-up order status
      operationId: getTopUpStatus
      security:
        - cookieAuth: []
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
          description: "Order ID or external invoice ID"
      responses:
        "200":
          description: Order status
          content:
            application/json:
              examples:
                pending:
                  summary: Payment pending
                  value:
                    ok: true
                    paid: false
                    status: "PENDING"
                    amount: 10000
                    finalAmount: null
                    createdAt: "2026-05-14T10:00:00.000Z"
                    updatedAt: "2026-05-14T10:00:00.000Z"
                completed:
                  summary: Payment completed
                  value:
                    ok: true
                    paid: true
                    status: "COMPLETED"
                    amount: 10000
                    finalAmount: 10200
                    createdAt: "2026-05-14T10:00:00.000Z"
                    updatedAt: "2026-05-14T10:05:00.000Z"
        "400":
          description: Missing reference
          content:
            application/json:
              example:
                error: "Reference is required"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Order not found
          content:
            application/json:
              example:
                error: "Order not found"

  /webhooks/bayar:
    post:
      tags: [TopUp]
      summary: Bayar.gg payment webhook
      operationId: bayarWebhook
      security: []
      description: |
        Webhook callback from Bayar.gg. Verifies HMAC SHA256 signature.
        On "paid" status: credits wallet, creates transaction records.
        Signature data format: "{invoiceId}|{status}|{finalAmount}|{timestamp}"
      parameters:
        - name: x-webhook-signature
          in: header
          required: true
          schema:
            type: string
          description: HMAC SHA256 signature
        - name: x-webhook-timestamp
          in: header
          required: true
          schema:
            type: string
          description: Webhook timestamp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                invoice_id:
                  type: string
                status:
                  type: string
                  enum: [paid, pending, failed, expired]
                amount:
                  type: number
                final_amount:
                  type: number
                unique_code:
                  type: string
                paid_at:
                  type: string
                paid_reff_num:
                  type: string
                customer_name:
                  type: string
                customer_email:
                  type: string
                customer_phone:
                  type: string
            example:
              invoice_id: "INV-20260514-ABC123"
              status: "paid"
              amount: 10000
              final_amount: 10000
              unique_code: "123"
              paid_at: "2026-05-14T10:05:00.000Z"
              paid_reff_num: "REF123456"
              customer_name: "Test User"
              customer_email: "test@example.com"
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              examples:
                success:
                  value:
                    ok: true
                ignored:
                  summary: Non-paid status ignored
                  value:
                    ok: true
                    ignored: true
                alreadyProcessed:
                  summary: Already processed
                  value:
                    ok: true
                    alreadyProcessed: true
        "401":
          description: Invalid signature
          content:
            application/json:
              example:
                error: "Invalid webhook signature"
        "404":
          description: Order not found
          content:
            application/json:
              example:
                error: "Order not found"

  /products:
    get:
      tags: [Products]
      summary: List all active products
      operationId: getProducts
      security: []
      description: Public endpoint. Supports pagination, filtering, sorting, and search.
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category slug
        - name: search
          in: query
          schema:
            type: string
          description: Search in name, description, tags
        - name: featured
          in: query
          schema:
            type: string
            enum: ["true"]
          description: Filter featured products only
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, price-asc, price-desc, name]
            default: newest
          description: Sort order
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Product list with pagination
          content:
            application/json:
              example:
                products:
                  - id: "clx4prod1"
                    name: "UI System Pro"
                    slug: "ui-system-pro"
                    shortDesc: "Professional UI framework for Roblox games"
                    thumbnail: "/images/ui-system-pro.png"
                    pricePersonal: 50000
                    priceCommercial: 150000
                    priceEnterprise: 500000
                    featured: true
                    version: "1.2.0"
                    tags: ["ui", "framework", "professional"]
                    category:
                      id: "clx4cat1"
                      name: "UI Systems"
                      slug: "ui-systems"
                    image: "/images/ui-system-pro.png"
                    soldCount: 42
                    createdAt: "2026-05-01T10:00:00.000Z"
                pagination:
                  page: 1
                  limit: 20
                  total: 5
                  totalPages: 1

  /products/categories:
    get:
      tags: [Products]
      summary: List all product categories
      operationId: getCategories
      security: []
      responses:
        "200":
          description: Category list
          content:
            application/json:
              example:
                categories:
                  - id: "clx4cat1"
                    name: "UI Systems"
                    slug: "ui-systems"
                    description: "Interface frameworks, menus, HUDs"
                    icon: "layout"
                    productCount: 3
                  - id: "clx4cat2"
                    name: "Utility Scripts"
                    slug: "utility-scripts"
                    description: "Helper functions and development tools"
                    icon: "wrench"
                    productCount: 5

  /products/{idOrSlug}:
    get:
      tags: [Products]
      summary: Get product detail
      operationId: getProductDetail
      security: []
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema:
            type: string
          description: Product ID or slug
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              example:
                id: "clx4prod1"
                name: "UI System Pro"
                slug: "ui-system-pro"
                description: "A comprehensive UI framework for Roblox game development. Includes menus, HUDs, notifications, and more."
                shortDesc: "Professional UI framework for Roblox games"
                thumbnail: "/images/ui-system-pro.png"
                pricePersonal: 50000
                priceCommercial: 150000
                priceEnterprise: 500000
                featured: true
                version: "1.2.0"
                tags: ["ui", "framework", "professional"]
                category:
                  id: "clx4cat1"
                  name: "UI Systems"
                  slug: "ui-systems"
                images:
                  - id: "clx4img1"
                    url: "/images/ui-system-pro-1.png"
                    sortOrder: 0
                docs:
                  - id: "clx4file1"
                    fileName: "README.md"
                    fileType: "documentation"
                    version: "1.2.0"
                soldCount: 42
                createdAt: "2026-05-01T10:00:00.000Z"
                updatedAt: "2026-05-10T15:00:00.000Z"
        "404":
          description: Product not found
          content:
            application/json:
              example:
                error: "Product not found"

  /cart:
    get:
      tags: [Cart]
      summary: Get shopping cart
      operationId: getCart
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Cart items with total
          content:
            application/json:
              example:
                items:
                  - id: "clx5cart1"
                    productId: "clx4prod1"
                    product:
                      id: "clx4prod1"
                      name: "UI System Pro"
                      slug: "ui-system-pro"
                      thumbnail: "/images/ui-system-pro.png"
                      pricePersonal: 50000
                      priceCommercial: 150000
                      priceEnterprise: 500000
                      active: true
                    licenseType: "PERSONAL"
                    priceRupiah: 50000
                    addedAt: "2026-05-14T10:00:00.000Z"
                total: 50000
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Cart]
      summary: Clear entire cart
      operationId: clearCart
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Cart cleared
          content:
            application/json:
              example:
                ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /cart/add:
    post:
      tags: [Cart]
      summary: Add item to cart
      operationId: addToCart
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId]
              properties:
                productId:
                  type: string
                licenseType:
                  type: string
                  enum: [PERSONAL, COMMERCIAL, ENTERPRISE]
                  default: PERSONAL
            example:
              productId: "clx4prod1"
              licenseType: "PERSONAL"
      responses:
        "201":
          description: Item added to cart
          content:
            application/json:
              example:
                ok: true
                item:
                  id: "clx5cart1"
                  productId: "clx4prod1"
                  licenseType: "PERSONAL"
                  priceRupiah: 50000
                  addedAt: "2026-05-14T10:00:00.000Z"
                updated: false
        "200":
          description: Existing item updated
          content:
            application/json:
              example:
                ok: true
                item:
                  id: "clx5cart1"
                  productId: "clx4prod1"
                  licenseType: "COMMERCIAL"
                  priceRupiah: 150000
                  addedAt: "2026-05-14T10:00:00.000Z"
                updated: true
        "400":
          description: Invalid request
          content:
            application/json:
              examples:
                missingProduct:
                  value:
                    error: "productId is required"
                invalidType:
                  value:
                    error: "Invalid licenseType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Product not found
          content:
            application/json:
              example:
                error: "Product not found"
        "409":
          description: Already owns license
          content:
            application/json:
              example:
                error: "You already own a license for this product"

  /cart/{itemId}:
    delete:
      tags: [Cart]
      summary: Remove item from cart
      operationId: removeFromCart
      security:
        - cookieAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
          description: Cart item ID
      responses:
        "200":
          description: Item removed
          content:
            application/json:
              example:
                ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Item not found
          content:
            application/json:
              example:
                error: "Item not found in cart"

  /checkout:
    post:
      tags: [Checkout]
      summary: Purchase all items in cart
      operationId: checkout
      security:
        - cookieAuth: []
      description: |
        Deducts wallet balance, generates license keys for each item, clears cart.
        License maxGames by type: PERSONAL=3, COMMERCIAL=10, ENTERPRISE=unlimited.
      responses:
        "201":
          description: Purchase successful
          content:
            application/json:
              example:
                ok: true
                purchases:
                  - id: "clx6pur1"
                    productId: "clx4prod1"
                    licenseType: "PERSONAL"
                    amountRupiah: 50000
                licenses:
                  - id: "clx6lic1"
                    productId: "clx4prod1"
                    licenseKey: "RBXR-A2B3-C4D5-E6F7-G8H9"
                    licenseType: "PERSONAL"
                    maxGames: 3
                totalCharged: 50000
                newBalance: 0
        "400":
          description: Cart is empty or no valid items
          content:
            application/json:
              examples:
                emptyCart:
                  value:
                    error: "Cart is empty"
                noValid:
                  value:
                    error: "No valid items in cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Insufficient balance
          content:
            application/json:
              example:
                error: "Insufficient balance"
                required: 50000
                balance: 10000
                shortfall: 40000
        "404":
          description: User not found
          content:
            application/json:
              example:
                error: "User not found"
        "409":
          description: Already owns all items
          content:
            application/json:
              example:
                error: "You already own licenses for all items in cart"

  /licenses:
    get:
      tags: [Licenses]
      summary: Get user licenses
      operationId: getLicenses
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of user licenses
          content:
            application/json:
              example:
                licenses:
                  - id: "clx6lic1"
                    licenseKey: "RBXR-A2B3-C4D5-E6F7-G8H9"
                    licenseType: "PERSONAL"
                    status: "ACTIVE"
                    maxGames: 3
                    expiresAt: null
